<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpace Hand Tracking Controller</title>
  
  <!-- Local OpenSpace API Driver -->
  <script src="./vendor/openspace-api.js"></script>
  
  <!-- Local Three.js & MediaPipe Tasks Vision Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "@mediapipe/tasks-vision": "./vendor/tasks-vision/tasks-vision.js"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0e14;
      color: #e0e6ed;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #30363d;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.5rem; color: #58a6ff; }
    
    .status-badge {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      background: #3d1a1a;
      color: #ff7b72;
      border: 1px solid #8e1515;
    }
    .status-badge.connected {
      background: #123d1c;
      color: #56d364;
      border-color: #2ea043;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: #8b949e; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .detect-grid { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }

    .cam-preview-container {
      width: 240px;
      height: 180px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: #8b949e; font-weight: 600; text-transform: uppercase; }
    input, select {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: monospace;
    }
    input:focus, select:focus { outline: none; border-color: #58a6ff; }

    /* Permanent Multi-Parameter Grid Monitor with Dynamic Visual Fill Bars */
    #paramMonitor {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      background: #0d1117;
      padding: 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .param-badge {
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .param-badge .key {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-family: monospace;
      z-index: 1;
    }
    .param-badge .val {
      font-size: 0.95rem;
      font-family: monospace;
      z-index: 1;
    }

    /* Active Tracked State (Blue Fill Bar) */
    .param-badge.active {
      background: linear-gradient(
        to right,
        rgba(31, 111, 235, 0.45) 0%,
        rgba(31, 111, 235, 0.45) var(--fill-pct, 0%),
        #161b22 var(--fill-pct, 0%),
        #161b22 100%
      );
      border: 1px solid #388bfd;
      box-shadow: 0 0 6px rgba(56, 139, 253, 0.2);
    }
    .param-badge.active .key {
      color: #58a6ff;
      font-weight: 600;
    }
    .param-badge.active .val {
      color: #ffffff;
      font-weight: 600;
    }

    /* Inactive State (Gray Fill Bar preserved at last state) */
    .param-badge.inactive {
      background: linear-gradient(
        to right,
        rgba(110, 118, 129, 0.25) 0%,
        rgba(110, 118, 129, 0.25) var(--fill-pct, 0%),
        #161b22 var(--fill-pct, 0%),
        #161b22 100%
      );
      border: 1px solid #21262d;
      opacity: 0.6;
    }
    .param-badge.inactive .key {
      color: #8b949e;
      font-weight: 400;
    }
    .param-badge.inactive .val {
      color: #8b949e;
    }

    .mapping-row {
      display: grid;
      grid-template-columns: 200px 1fr 90px 90px 40px;
      gap: 10px;
      align-items: center;
      background: #0d1117;
      border: 1px solid #21262d;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #1f6feb; color: #ffffff; border-color: #388bfd; }
    .btn-primary:hover { background: #388bfd; }
    .btn-active { background: #238636; color: #ffffff; border-color: #2ea043; }
    .btn-danger { background: #da3633; color: #ffffff; border-color: #f85149; height: 35px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>OpenSpace Hand Tracking Controller</h1>
    <div id="connection-badge" class="status-badge">Disconnected</div>
  </header>

  <!-- Connection Setup -->
  <div class="card">
    <h2>Connection Settings</h2>
    <div class="grid-2">
      <div class="field">
        <label>Target Host IP</label>
        <input type="text" id="targetHost" value="localhost">
      </div>
      <div class="field">
        <label>Target Port</label>
        <input type="text" id="targetPort" value="4682">
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.initConnection()">Connect to OpenSpace</button>
    </div>
  </div>

  <!-- Camera & Dynamic Bar Parameter Monitor -->
  <div class="card">
    <h2>Webcam & Gesture Signal Monitor</h2>
    <div class="detect-grid">
      <div class="cam-preview-container">
        <video id="webcam" autoplay playsinline muted></video>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
        <button id="detectBtn" class="btn btn-primary" style="width: max-content;">Enable Tracking Camera</button>

        <div class="field">
          <label>Tracked Hand Parameters (Live Fill Bars)</label>
          <div id="paramMonitor"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Control Mappings -->
  <div class="card">
    <h2>Gesture Control Mappings</h2>
    <div id="mappingsContainer"></div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.addMappingRow()">+ Add Control Mapping</button>
      <button class="btn" onclick="window.saveToLocalStorage()">💾 Save Configuration</button>
      <button class="btn" onclick="window.exportConfig()">📥 Export JSON</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">📤 Import JSON</button>
      <input type="file" id="fileInput" accept=".json" onchange="window.importConfig(event)">
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

    // --- State Variables ---
    let openspace = null;
    let nativeSocket = null;
    let isConnected = false;
    let handLandmarker = null;
    let trackingActive = false;
    let rowCounter = 0;
    const activeMappings = {};
    const currentParamValues = {};
    const lastKnownParamValues = {};

    const PARAM_OPTIONS = [
      { key: 'primary_palm_x', label: 'Primary Hand X (Screen)' },
      { key: 'primary_palm_y', label: 'Primary Hand Y (Screen)' },
      { key: 'primary_pitch', label: 'Palm Pitch (Up/Down)' },
      { key: 'primary_yaw', label: 'Palm Yaw (Left/Right)' },
      { key: 'primary_roll', label: 'Palm Roll (Wrist Twist)' },
      { key: 'primary_openness', label: 'Hand Openness (Fist -> Palm)' },
      { key: 'twohand_distance', label: '2-Hand Distance (Zoom)' },
      { key: 'twohand_mid_x', label: '2-Hand Midpoint X (Pan X)' },
      { key: 'twohand_mid_y', label: '2-Hand Midpoint Y (Pan Y)' },
      { key: 'twohand_roll', label: '2-Hand Steering Roll' },
      { key: 'twofist_explode', label: '2-Fist Pull Progress' }
    ];

    // --- Connection Driver ---
    function updateStatus(connected, message) {
      isConnected = connected;
      const badge = document.getElementById('connection-badge');
      badge.textContent = message;
      if (connected) badge.classList.add('connected');
      else badge.classList.remove('connected');
    }

    window.initConnection = function() {
      const host = document.getElementById('targetHost').value || 'localhost';
      const port = document.getElementById('targetPort').value || '4682';

      if (typeof window.openspaceApi === 'function') {
        try {
          console.log(`Connecting via openspaceApi library to ${host}:${port}...`);
          const api = window.openspaceApi(host, port);

          api.onConnect(async () => {
            try {
              openspace = await api.library();
              updateStatus(true, `Connected (API Port ${port})`);
            } catch (err) {
              console.warn("API Handshake failed, resorting to native WebSocket:", err);
              initNativeWebSocket(host, port);
            }
          });

          api.onDisconnect(() => {
            updateStatus(false, 'Disconnected from OpenSpace');
          });

          api.connect();
          return;
        } catch (e) {
          console.warn("Library connection attempt failed:", e);
        }
      }

      initNativeWebSocket(host, port);
    };

    function initNativeWebSocket(host, port) {
      console.log(`Connecting via Native WebSocket (ws://${host}:${port}/)...`);
      try {
        nativeSocket = new WebSocket(`ws://${host}:${port}/`);
        nativeSocket.onopen = () => updateStatus(true, `Connected (Native WS Port ${port})`);
        nativeSocket.onclose = () => updateStatus(false, 'Disconnected from OpenSpace');
        nativeSocket.onerror = (err) => {
          console.error("WebSocket Error:", err);
          updateStatus(false, 'Connection Error');
        };
      } catch (err) {
        console.error("Failed to construct WebSocket:", err);
      }
    }

    function sendLuaCommand(luaScript) {
      if (!isConnected) return;

      if (openspace) {
        try {
          eval(`openspace.${luaScript.replace(/^openspace\./, '')}`);
          return;
        } catch (e) {}
      }

      if (nativeSocket && nativeSocket.readyState === WebSocket.OPEN) {
        const payload = {
          topic: 0,
          type: "luascript",
          payload: { script: luaScript }
        };
        nativeSocket.send(JSON.stringify(payload));
      }
    }

    // --- MediaPipe Hand Tracking Engine (Local Offline Loader) ---
    async function initHandTracking() {
      const vision = await FilesetResolver.forVisionTasks("./vendor/tasks-vision");
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "./models/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }

    async function startCamera() {
      const video = document.getElementById('webcam');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
      video.srcObject = stream;
      await video.play();
      requestAnimationFrame(processVideoFrame);
    }

    function processVideoFrame() {
      const video = document.getElementById('webcam');
      if (trackingActive && handLandmarker && video.readyState >= 2) {
        const results = handLandmarker.detectForVideo(video, performance.now());
        extractHandParameters(results);
        dispatchToOpenSpace();
      }
      if (trackingActive) requestAnimationFrame(processVideoFrame);
    }

    function extractHandParameters(results) {
      const lms = results.landmarks || [];
      const worlds = results.worldLandmarks || [];

      // Wipe current frame parameter buffer
      for (const k in currentParamValues) delete currentParamValues[k];

      if (lms.length === 0) {
        updateParamMonitor();
        return;
      }

      // 1. Primary Hand Parameters
      const lm = lms[0];
      const w = worlds[0];

      let cx = 0, cy = 0;
      [0, 5, 9, 13, 17].forEach(i => { cx += lm[i].x; cy += lm[i].y; });
      currentParamValues['primary_palm_x'] = 1.0 - (cx / 5.0); // Mirrored
      currentParamValues['primary_palm_y'] = cy / 5.0;

      if (w && w.length >= 21) {
        const q = computePalmQuat(w);
        const euler = new THREE.Euler().setFromQuaternion(q, 'YXZ');
        currentParamValues['primary_pitch'] = THREE.MathUtils.clamp((euler.x + Math.PI/2) / Math.PI, 0, 1);
        currentParamValues['primary_yaw'] = THREE.MathUtils.clamp((euler.y + Math.PI) / (2 * Math.PI), 0, 1);
        currentParamValues['primary_roll'] = THREE.MathUtils.clamp((euler.z + Math.PI) / (2 * Math.PI), 0, 1);
      }

      currentParamValues['primary_openness'] = computeOpenness(w || lm);

      // 2. Dual Hand Parameters
      if (lms.length >= 2) {
        const lm2 = lms[1];
        let cx2 = 0, cy2 = 0;
        [0, 5, 9, 13, 17].forEach(i => { cx2 += lm2[i].x; cy2 += lm2[i].y; });
        cx2 = 1.0 - (cx2 / 5.0); cy2 /= 5.0;

        const dx = cx2 - currentParamValues['primary_palm_x'];
        const dy = cy2 - currentParamValues['primary_palm_y'];
        const dist = Math.hypot(dx, dy);

        currentParamValues['twohand_distance'] = THREE.MathUtils.clamp((dist - 0.05) / 0.75, 0, 1);
        currentParamValues['twohand_mid_x'] = (currentParamValues['primary_palm_x'] + cx2) / 2.0;
        currentParamValues['twohand_mid_y'] = (currentParamValues['primary_palm_y'] + cy2) / 2.0;
        currentParamValues['twohand_roll'] = (Math.atan2(dy, dx) + Math.PI) / (2 * Math.PI);

        // 2-Fist Pull Progress
        const open2 = computeOpenness(worlds[1] || lm2);
        const bothFists = (1.0 - currentParamValues['primary_openness']) * (1.0 - open2);
        currentParamValues['twofist_explode'] = THREE.MathUtils.clamp(bothFists * (dist / 0.6), 0, 1);
      }

      // Record active values into historical memory buffer
      Object.keys(currentParamValues).forEach(k => {
        lastKnownParamValues[k] = currentParamValues[k];
      });

      updateParamMonitor();
    }

    // --- Multi-Parameter Grid Renderer with Dynamic Progress Fill Bars ---
    function updateParamMonitor() {
      const monitorEl = document.getElementById('paramMonitor');
      let html = '';

      PARAM_OPTIONS.forEach(opt => {
        const isActive = (currentParamValues[opt.key] !== undefined);
        const hasHistory = (lastKnownParamValues[opt.key] !== undefined);
        const val = isActive ? currentParamValues[opt.key] : (hasHistory ? lastKnownParamValues[opt.key] : 0);
        
        const pct = (val * 100).toFixed(1);
        const badgeClass = isActive ? 'param-badge active' : 'param-badge inactive';
        const displayVal = hasHistory || isActive ? val.toFixed(2) : '--';

        html += `
          <div class="${badgeClass}" style="--fill-pct: ${pct}%;">
            <span class="key">${opt.key}</span>
            <span class="val">${displayVal}</span>
          </div>
        `;
      });

      monitorEl.innerHTML = html;
    }

    function computePalmQuat(world) {
      const p0 = new THREE.Vector3(-world[0].x, -world[0].y, world[0].z);
      const p9 = new THREE.Vector3(-world[9].x, -world[9].y, world[9].z);
      const p5 = new THREE.Vector3(-world[5].x, -world[5].y, world[5].z);
      const p17 = new THREE.Vector3(-world[17].x, -world[17].y, world[17].z);

      const up = p9.sub(p0).normalize();
      const across = p5.sub(p17);
      const z = new THREE.Vector3().crossVectors(across, up).normalize();
      const x = new THREE.Vector3().crossVectors(up, z).normalize();

      return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, up, z));
    }

    function computeOpenness(world) {
      let sum = 0;
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      for (let i = 0; i < 4; i++) {
        sum += Math.hypot(world[tips[i]].x - world[mcps[i]].x, world[tips[i]].y - world[mcps[i]].y);
      }
      return THREE.MathUtils.clamp(sum / 0.6, 0, 1);
    }

    function dispatchToOpenSpace() {
      Object.keys(activeMappings).forEach(key => {
        const rawVal = currentParamValues[key];
        if (rawVal === undefined) return;

        const mapping = activeMappings[key];
        const minVal = parseFloat(mapping.min) || 0;
        const maxVal = parseFloat(mapping.max) || 1;
        const scaledValue = minVal + (rawVal * (maxVal - minVal));

        const command = mapping.luaTemplate.replace(/\{VALUE\}/g, scaledValue.toFixed(4));
        sendLuaCommand(command);
      });
    }

    // --- Dynamic UI Mapping Rows ---
    window.addMappingRow = function(data = null) {
      rowCounter++;
      const id = rowCounter;
      const container = document.getElementById('mappingsContainer');
      const row = document.createElement('div');
      row.className = 'mapping-row';
      row.id = `row_${id}`;

      const defaultLua = "openspace.setPropertyValueSingle('Scene.Earth.Renderable.Layers.ColorLayers.ESRI_VIIRS_Combo.Opacity', {VALUE});";
      const selectedParam = data ? data.param : 'primary_palm_x';

      row.innerHTML = `
        <select id="param_${id}" onchange="window.updateMapping(${id})">
          <option value="">Select Parameter...</option>
          ${PARAM_OPTIONS.map(o => `<option value="${o.key}" ${o.key === selectedParam ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
        <input type="text" id="lua_${id}" placeholder="openspace.setPropertyValueSingle('Prop', {VALUE})" value="${data ? data.luaTemplate : defaultLua}" onchange="window.updateMapping(${id})">
        <input type="number" id="min_${id}" step="0.1" value="${data ? data.min : '0.0'}" onchange="window.updateMapping(${id})">
        <input type="number" id="max_${id}" step="0.1" value="${data ? data.max : '1.0'}" onchange="window.updateMapping(${id})">
        <button class="btn btn-danger" onclick="window.removeRow(${id})">×</button>
      `;

      container.appendChild(row);
      window.updateMapping(id);
    };

    window.updateMapping = function(id) {
      const paramKey = document.getElementById(`param_${id}`).value;
      const luaTemplate = document.getElementById(`lua_${id}`).value;
      const min = document.getElementById(`min_${id}`).value;
      const max = document.getElementById(`max_${id}`).value;

      if (paramKey && luaTemplate) {
        activeMappings[paramKey] = { param: paramKey, luaTemplate, min, max };
      }
    };

    window.removeRow = function(id) {
      const row = document.getElementById(`row_${id}`);
      if (row) {
        const paramKey = document.getElementById(`param_${id}`).value;
        delete activeMappings[paramKey];
        row.remove();
      }
    };

    // --- LocalStorage & Import / Export ---
    window.saveToLocalStorage = function() {
      localStorage.setItem('openspace_hand_mappings', JSON.stringify(Object.values(activeMappings)));
      alert('Mappings saved to browser LocalStorage!');
    };

    window.exportConfig = function() {
      const blob = new Blob([JSON.stringify(Object.values(activeMappings), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'openspace-hand-config.json';
      a.click();
    };

    window.importConfig = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const mappings = JSON.parse(ev.target.result);
        document.getElementById('mappingsContainer').innerHTML = '';
        Object.keys(activeMappings).forEach(k => delete activeMappings[k]);
        mappings.forEach(m => window.addMappingRow(m));
      };
      reader.readAsText(file);
    };

    // --- DOM Setup & Controls ---
    document.getElementById('detectBtn').addEventListener('click', async function() {
      if (!trackingActive) {
        this.textContent = 'Initializing Camera...';
        await initHandTracking();
        await startCamera();
        trackingActive = true;
        this.classList.add('btn-active');
        this.textContent = 'Tracking Active (Click to Stop)';
      } else {
        trackingActive = false;
        this.classList.remove('btn-active');
        this.textContent = 'Enable Tracking Camera';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateParamMonitor();
      window.addMappingRow();
      window.initConnection();
    });
  </script>
</body>
</html>
